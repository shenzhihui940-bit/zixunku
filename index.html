<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>作品集资讯库</title>

<style>
:root{
  --bg:#f5f4f0; --surface:#fff; --ink:#191917; --ink-2:#55534e; --ink-3:#8b8880;
  --line:#e4e2dc; --line-2:#d3d0c8; --accent:#2f4f46; --accent-soft:#e6ece9;
  --ok:#2f6b4f; --ok-bg:#e5f0ea; --warn:#9a6212; --warn-bg:#f8eedc;
  --r:12px; --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
header.top{padding:40px 0 0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
h1{font-size:32px;line-height:1.2;margin:6px 0 10px;font-weight:650;letter-spacing:-.01em}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--ink-2);font-size:14px}
.meta b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* 一级 tabs */
nav.tabs{position:sticky;top:0;z-index:10;background:rgba(245,244,240,.92);backdrop-filter:saturate(1.4) blur(8px);-webkit-backdrop-filter:saturate(1.4) blur(8px);border-bottom:1px solid var(--line);margin-top:24px}
nav.tabs .wrap{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav.tabs .wrap::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:14px 12px 12px;font-size:15px;color:var(--ink-3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;flex-shrink:0}
.tab[aria-selected=true]{color:var(--ink);border-color:var(--ink);font-weight:600}
.tab .n{font-size:12px;color:var(--ink-3);margin-left:4px;font-weight:400}

main{padding:20px 0 64px}

/* 二级 category row */
.subtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.subtab{border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:8px 14px;font-size:14px;cursor:pointer;color:var(--ink-2);line-height:1.3}
.subtab:hover{border-color:var(--ink-2);color:var(--ink)}
.subtab[aria-selected=true]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:550}
.subtab .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums;font-size:12px}
.subtab[aria-selected=true] .n{opacity:.7}

/* toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.search{flex:1;position:relative}
.search input{width:100%;height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);padding:0 14px 0 38px;font:inherit;color:var(--ink);outline:none}
.search input:focus{border-color:var(--ink-2)}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.btn{height:44px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
#facetToggle{display:none}
.facets{margin-bottom:8px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:6px 16px}
.facets[hidden]{display:none}
.fgroup{display:grid;grid-template-columns:72px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.fgroup:first-child{border-top:0}
.flabel{font-size:13px;color:var(--ink-3);padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;line-height:1.5;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-2);color:var(--ink)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .c{opacity:.55;margin-left:4px;font-variant-numeric:tabular-nums}
.chip[disabled]{opacity:.35;cursor:default}
.status{display:flex;justify-content:space-between;align-items:center;margin:12px 0 12px;font-size:14px;color:var(--ink-2)}
.linkbtn{background:none;border:0;padding:0;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:14px}
.linkbtn[hidden]{display:none}


/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.card{min-width:0;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:border-color .12s}
.card:hover{border-color:var(--ink-3)}
.card .body{padding:14px 18px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.cover{position:relative;display:block;aspect-ratio:16/10;background:var(--ph,#55534e);overflow:hidden;border-bottom:1px solid var(--line)}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.88);font-size:44px;font-weight:650}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center;background:#fff}
.card:hover .cover img{opacity:.94}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.pill{font-size:12px;padding:1px 8px;border-radius:6px;background:#f0efeb;color:var(--ink-2);line-height:1.7}
.pill.cat{background:var(--accent-soft);color:var(--accent)}
.badge{font-size:12px;padding:1px 8px;border-radius:6px;line-height:1.7;display:inline-flex;align-items:center;gap:5px;margin-left:auto}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.ok{color:var(--ok);background:var(--ok-bg)}
.badge.warn{color:var(--warn);background:var(--warn-bg)}
.card h3{margin:0;font-size:16px;line-height:1.45;font-weight:600}
.card h3 a{text-decoration:none}
.card h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.card h3 .ext{color:var(--ink-3);font-weight:400;font-size:13px;margin-left:2px}
.host{font-size:12px;color:var(--ink-3);word-break:break-all;margin-top:-6px;text-decoration:none;align-self:flex-start}
.host:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.why{margin:0;color:var(--ink-2);font-size:14px}
.tags{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-3)}
.tags span::before{content:"#";opacity:.6}
.srcbox{margin-top:auto;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:12.5px;line-height:1.55}
.srcbox dt{color:var(--ink-3)}
.srcbox dd{margin:0;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srcbox dd .more{color:var(--ink-3);margin-left:4px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;color:var(--ink-3)}
.open{display:inline-flex;align-items:center;height:32px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;color:var(--ink);text-decoration:none;font-size:13px;font-weight:500;white-space:nowrap}
.open:hover{border-color:var(--ink);background:var(--ink);color:#fff}
.empty{padding:48px 0;text-align:center;color:var(--ink-3)}
footer{color:var(--ink-3);font-size:12px;padding:0 0 40px}
@media (max-width:720px){
  .wrap{padding:0 16px}
  header.top{padding-top:24px}
  h1{font-size:26px}
  .meta{font-size:13px}
  .tab{padding:14px 10px 12px;font-size:14px}
  #facetToggle{display:block}
  .facets{display:none;padding:4px 14px}
  .facets.open{display:block}
  .facets[hidden]{display:none}
  .fgroup{grid-template-columns:1fr;gap:6px}
  .flabel{padding-top:0}
  .grid{grid-template-columns:minmax(0,1fr)}
  .card .body{padding:12px 16px 14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* mark actions & pick states */
.markbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-top:8px;border-top:1px dashed var(--line);margin-top:2px}
.markbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);line-height:1.3}
.markbtn:hover{border-color:var(--ink-2);color:var(--ink)}
.markbtn[aria-pressed=true]{font-weight:600}
.markbtn.useful[aria-pressed=true]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.markbtn.skip[aria-pressed=true]{background:#f3f1ec;border-color:var(--ink-3);color:var(--ink-3)}
.markbtn.edit{border-style:dashed;color:var(--ok)}
.markbtn.edit:hover{border-color:var(--ok)}
.mark-sum{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;width:100%;margin-top:2px}
.tsum{font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--ok-bg);color:var(--ok);line-height:1.7}
.tsum.tone-emph{background:#dcefe3;color:#1f6a41;font-weight:600}
.tsum.tone-drop{background:#f6e3df;color:#9a3b2a;font-weight:600}
.mark-note{font-size:12px;color:var(--ink-2);margin:0;line-height:1.5;width:100%}
.mark-note::before{content:"备注 · ";color:var(--ink-3)}
.card.marked-useful{border-color:#b7d0c2;box-shadow:inset 0 0 0 1px rgba(47,107,79,.18)}
.card.marked-useful .cover{box-shadow:inset 3px 0 0 var(--ok)}
.card.marked-skip{opacity:.42}
.card.marked-skip:hover{opacity:.72}
.card.editing{opacity:1;border-color:var(--ok)}
.pick-badge{font-size:11px;padding:1px 7px;border-radius:6px;background:var(--ok-bg);color:var(--ok);font-weight:550;line-height:1.7;border:0;cursor:pointer;font-family:inherit}
.pick-badge:hover{text-decoration:underline;text-underline-offset:2px}
.pick-badge.manual{background:#eef0f6;color:#3a4a6b;cursor:default}
.pick-badge.manual:hover{text-decoration:none}
.filter-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.filter-row[hidden]{display:none}
.filter-chip{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.filter-chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.filter-chip[hidden]{display:none}

/* tag picker */
.tagpicker{width:100%;margin-top:4px;border:1px solid #b7d0c2;background:#f7faf8;border-radius:10px;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;cursor:default}
.tp-head{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:600;color:var(--ink)}
.tp-head .tp-sub{font-size:12px;font-weight:400;color:var(--ink-3)}
.tp-group{display:grid;grid-template-columns:56px 1fr;gap:6px;align-items:start}
.tp-group.solo{grid-template-columns:1fr}
.tp-glabel{font-size:12px;color:var(--ink-3);padding-top:4px}
.tp-chips{display:flex;flex-wrap:wrap;gap:5px}
.tchip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2);line-height:1.5}
.tchip:hover{border-color:var(--ok);color:var(--ok)}
.tchip[aria-pressed=true]{background:var(--ok);border-color:var(--ok);color:#fff}
.tchip[aria-pressed=true]::before{content:"✓ "}
.tchip.tone-emph[aria-pressed=true]{background:#1f6a41;border-color:#1f6a41}
.tchip.tone-drop[aria-pressed=true]{background:#9a3b2a;border-color:#9a3b2a}
.tp-note{height:32px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font:inherit;font-size:13px;outline:none;background:#fff;width:100%}
.tp-note:focus{border-color:var(--ok)}
.tp-actions{display:flex;gap:8px;align-items:center}
.tp-actions .linkbtn{margin-left:auto;font-size:12px;color:var(--ink-3)}
.btn-primary.sm,.btn-ghost.sm{height:30px;padding:0 12px;font-size:12.5px}

/* manual pick form */
.pick-form{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px 16px;margin-bottom:16px}
.pick-form[hidden]{display:none}
.pick-form h2{margin:0 0 10px;font-size:15px;font-weight:600}
.pick-form .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-3)}
.pick-form .full{grid-column:1/-1}
.pick-form input{height:36px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;font:inherit;color:var(--ink);background:#fff;outline:none}
.pick-form input:focus{border-color:var(--ink-2)}
.pick-form .pf-tags{display:flex;flex-direction:column;gap:6px}
.pick-form .pf-tags>.lbl{font-size:12px;color:var(--ink-3)}
.pick-form .actions{display:flex;gap:8px;align-items:center;margin-top:12px}
.pick-form .hint{font-size:12px;color:var(--ink-3);margin:0}
.btn-primary{height:36px;padding:0 14px;border:1px solid var(--accent);border-radius:8px;background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:550}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{height:36px;padding:0 12px;border:1px solid var(--line-2);border-radius:8px;background:transparent;cursor:pointer;font-size:13px;color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--ink-2);color:var(--ink)}

/* notebook */
#notebook[hidden],.grid[hidden],.status[hidden],.subtabs[hidden],.toolbar[hidden]{display:none}
.grid .empty{grid-column:1/-1}
.nb-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:4px 0 16px}
.nb-head .nb-sum{font-size:14px;color:var(--ink-2)}
.nb-head .nb-sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.nb-head .nb-actions{display:flex;gap:8px}
.nb-top{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.nb-sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 18px 12px;margin-bottom:14px}
.nb-top .nb-sec{margin-bottom:0}
.nb-sec h2{margin:0;font-size:16px;font-weight:650;display:flex;align-items:baseline;gap:8px}
.nb-sec h2 .n{font-size:12px;font-weight:400;color:var(--ink-3)}
.nb-sec .nb-desc{margin:2px 0 8px;font-size:12.5px;color:var(--ink-3)}
.nb-sec.hl-emph{border-color:#9fcfb2;background:#f2f9f4;box-shadow:inset 4px 0 0 #1f6a41}
.nb-sec.hl-emph h2{color:#1f6a41}
.nb-sec.hl-drop{border-color:#e5b9ae;background:#fcf4f2;box-shadow:inset 4px 0 0 #9a3b2a}
.nb-sec.hl-drop h2{color:#9a3b2a}
.nb-sec.hl-copy{border-color:#c9cfe0;background:#f5f6fa;box-shadow:inset 4px 0 0 #3a4a6b}
.nb-sec.hl-copy h2{color:#3a4a6b}
.nb-tag{margin-top:8px}
.nb-tag h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--accent)}
.nb-tag h3 .n{font-weight:400;color:var(--ink-3);margin-left:4px}
.nb-list{list-style:none;margin:0;padding:0}
.nb-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.5}
.nb-list .nb-line:first-child{border-top:0}
.nb-line .nb-main{min-width:0}
.nb-line a.t{color:var(--ink);text-decoration:none;font-weight:550}
.nb-line a.t:hover{text-decoration:underline;text-underline-offset:3px}
.nb-line a.t .ext{color:var(--ink-3);font-weight:400;font-size:12px}
.nb-line .nb-note{color:var(--ink-2);margin-left:8px}
.nb-line .nb-note::before{content:"— ";color:var(--ink-3)}
.nb-line .nb-meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--ink-3);white-space:nowrap}
.nb-line .nb-edit{background:none;border:0;padding:0;font:inherit;font-size:12px;color:var(--ink-3);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.nb-line .nb-edit:hover{color:var(--ink)}
.nb-emptyline{font-size:12.5px;color:var(--ink-3);padding:6px 0 4px}
.nb-empty{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:36px 24px;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.8}
.nb-empty h2{margin:0 0 8px;font-size:17px;color:var(--ink)}
.nb-empty ol{display:inline-block;text-align:left;margin:4px 0 0;padding-left:20px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:1}
@media (max-width:720px){
  .pick-form .fields{grid-template-columns:1fr}
  .nb-top{grid-template-columns:1fr}
  .nb-line{grid-template-columns:1fr}
  .nb-sec{padding:12px 14px 10px}
}

</style>
</head>

<header class="top"><div class="wrap">
  <div class="eyebrow">Portfolio · Resume · Signals</div>
  <h1>作品集资讯库</h1>
  <div class="meta"><span>条目 <b id="mTotal">0</b></span><span>已核 <b id="mOk">0</b> · 未核链 <b id="mWarn">0</b></span><span>最后更新 <b id="mDate">—</b></span></div>
</div></header>
<nav class="tabs"><div class="wrap" role="tablist" id="tablist"></div></nav>
<main><div class="wrap">
  <div class="subtabs" id="subtabs" role="tablist" aria-label="二级分类"></div>
  <div class="pick-form" id="pickForm" hidden>
    <h2>添加外部精选</h2>
    <div class="fields">
      <label class="full">标题<input id="pfTitle" type="text" placeholder="必填" autocomplete="off"></label>
      <label class="full">链接<input id="pfUrl" type="url" placeholder="https://…" autocomplete="off"></label>
      <label>备注<input id="pfNote" type="text" maxlength="80" placeholder="可选，一句话" autocomplete="off"></label>
      <label>来源<input id="pfSource" type="text" placeholder="可选" autocomplete="off"></label>
      <div class="pf-tags full"><span class="lbl">哪里有用（可多选）</span><div id="pfTagChips"></div></div>
    </div>
    <div class="actions">
      <button type="button" class="btn-primary" id="pfAdd">加入精选</button>
      <button type="button" class="btn-ghost" id="pfClear">清空</button>
      <p class="hint">仅保存在本机浏览器，不写入 data.json</p>
    </div>
  </div>
  <div class="toolbar">
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="搜索标题、要点、标签、网址…" autocomplete="off"></label>
    <button class="btn" id="facetToggle" aria-expanded="false">筛选</button>
  </div>
  <div class="filter-row" id="filterRow">
    <button type="button" class="filter-chip" id="onlyUnmarked" aria-pressed="false" hidden>只看未标记</button>
    <button type="button" class="filter-chip" id="hideSkip" aria-pressed="false" hidden>隐藏「不看了」</button>
  </div>
  <div class="facets" id="facets"></div>
  <div class="status"><span id="count"></span><button class="linkbtn" id="clear" hidden>清除筛选</button></div>
  <div id="notebook" hidden></div>
  <div class="grid" id="grid"></div>
</div></main>
<footer><div class="wrap">数据：data.json · 由 build.py 生成内嵌副本 · 构建 <span id="bt"></span></div></footer>

  {g:'内容',tags:['故事怎么讲','案例够不够深','有没有结果数字']},
  {g:'架构',tags:['信息怎么排','交互怎么走','设计系统']},
  {g:'岗位相关',tags:['有AI产品感','说清人机边界','有可点开的Demo']}
];
const TAGSET_JOB=[{g:'用途',tags:['简历/作品集要写进去','别再这么写了','面试官在看什么','岗位要求变了','这句话能直接用']}];
const TONE={'简历/作品集要写进去':'tone-emph','别再这么写了':'tone-drop'};
const TAG_RENAME={
  '该强调的':'简历/作品集要写进去','已过时的':'别再这么写了','招聘方在看':'面试官在看什么','岗位在变':'岗位要求变了','可以直接抄':'这句话能直接用',
  '叙事':'故事怎么讲','案例深度':'案例够不够深','结果数据':'有没有结果数字',
  '信息架构':'信息怎么排','交互流程':'交互怎么走','系统设计':'设计系统',
  'AI产品感':'有AI产品感','人机边界':'说清人机边界','可运行Demo':'有可点开的Demo'
};
function renameTags(arr){
  if(!Array.isArray(arr)) return arr;
  let ch=false;
  const out=[];
  const seen=new Set();
  arr.forEach(t=>{
    const n=TAG_RENAME[t]||t;
    if(n!==t) ch=true;
    if(!seen.has(n)){seen.add(n);out.push(n);}
  });
  return ch?out:arr;
}
function tagSetFor(t){return t==='招聘信息'?TAGSET_JOB:TAGSET_PORTFOLIO;}

function loadJSON(key, fallback){
  try{const raw=localStorage.getItem(key);if(!raw)return fallback;const v=JSON.parse(raw);return v==null?fallback:v;}
  catch(e){return fallback;}
}
function saveJSON(key, val){
  try{localStorage.setItem(key, JSON.stringify(val));}catch(e){console.warn('localStorage 写入失败', e);}
}

let marks=loadJSON(LS_MARKS, {}); // { [id]: { mark:'useful', tags:[], note, at } | { mark:'skip', at } }
let manualPicks=loadJSON(LS_MANUAL, []); // [{ id, title, url, note, tags:[], source, added }]
if(!marks||typeof marks!=='object'||Array.isArray(marks)) marks={};
if(!Array.isArray(manualPicks)) manualPicks=[];

// 迁移：去掉「一般」(ok) 等旧值 → 未标记；有用补 tags 数组；旧标签文案 → 白话新名
(function migrate(){
  let ch=false;
  Object.keys(marks).forEach(id=>{
    const m=marks[id];
    if(!m||typeof m!=='object'||(m.mark!=='useful'&&m.mark!=='skip')){delete marks[id];ch=true;return;}
    if(m.mark==='useful'&&!Array.isArray(m.tags)){m.tags=[];ch=true;}
    if(m.mark==='useful'&&Array.isArray(m.tags)){
      const renamed=renameTags(m.tags);
      if(renamed!==m.tags){m.tags=renamed;ch=true;}
    }
  });
  if(ch) saveJSON(LS_MARKS, marks);
  let ch2=false;
  manualPicks.forEach(p=>{
    if(!Array.isArray(p.tags)){p.tags=[];ch2=true;}
    else{const renamed=renameTags(p.tags);if(renamed!==p.tags){p.tags=renamed;ch2=true;}}
  });
  if(ch2) saveJSON(LS_MANUAL, manualPicks);
})();

let category=null;
let q='';
const facet={platform:new Set()};
let onlyUnmarked=false;
let hideSkip=false;
let editing=null;      // 'lib:<id>' | 'man:<id>' 正在编辑标签的卡
let editingNew=false;  // 刚点「有用」打开的
let scrollToKey=null;

$('#mTotal').textContent=DATA.length;
$('#mOk').textContent=DATA.filter(d=>d.verified==='已核').length;
$('#mWarn').textContent=DATA.filter(d=>d.verified!=='已核').length;

const BY_ID=new Map(DATA.map(d=>[d.id,d]));
function getMark(id){return marks[id]||null;}
function isUseful(id){return (marks[id]||{}).mark==='useful';}
function setMark(id, mark, opts){
  const now=new Date().toISOString();
  if(!mark){delete marks[id];}
  else if(mark==='useful'){
    const prev=isUseful(id)?marks[id]:{};
    marks[id]={mark:'useful',tags:(opts&&opts.tags)||prev.tags||[],note:(opts&&opts.note!=null)?opts.note:(prev.note||''),at:now};
  }else{
    marks[id]={mark:'skip',at:now};
  }
  saveJSON(LS_MARKS, marks);
}
function countUseful(){return DATA.filter(d=>isUseful(d.id)).length+manualPicks.length;}
function countTab(t){
  if(LOCAL_TABS.includes(t)) return countUseful();
  return DATA.filter(d=>d.tab===t).length;
}
function catsFor(t){
  if(LOCAL_TABS.includes(t)) return [];
  const order=CAT_ORDER[t]||[];
  const cnt=new Map();
  DATA.filter(d=>d.tab===t).forEach(d=>cnt.set(d.category,(cnt.get(d.category)||0)+1));
  return order.filter(c=>cnt.get(c)>0).map(c=>({name:c,n:cnt.get(c)}));
}
function isPicks(){return tab===PICKS_TAB;}
function isNote(){return tab===NOTE_TAB;}
function isLocal(){return LOCAL_TABS.includes(tab);}
function qMatch(parts){
  if(!q) return true;
  const hay=parts.join(' ').toLowerCase();
  return q.split(/\s+/).every(t=>hay.includes(t));
}

function inScope(d){
  if(isLocal()) return isUseful(d.id);
  if(d.tab!==tab) return false;
  if(category && d.category!==category) return false;
  return true;
}
function matchLib(d,skip){
  if(!inScope(d)) return false;
  const m=getMark(d.id);
  if(onlyUnmarked && m) return false;
  if(hideSkip && m && m.mark==='skip') return false;
  if(skip!=='platform' && facet.platform.size && !facet.platform.has(d.platform)) return false;
  return qMatch([d.title,d.why,d.url,d.platform,d.track,d.type,d.category,d.tab,d.tags.join(' '),d.source_note,(m&&m.note)||'',((m&&m.tags)||[]).join(' ')]);
}
function matchManual(p){return qMatch([p.title,p.url,p.note||'',p.source||'',(p.tags||[]).join(' ')]);}

function writeHash(){
  const parts=[encodeURIComponent(tab)];
  if(category && !isLocal()) parts.push(encodeURIComponent(category));
  const h='#'+parts.join('/');
  if(location.hash!==h) history.replaceState(null,'',h);
}
function readHash(){
  const raw=(location.hash||'').replace(/^#/,'').trim();
  if(!raw){tab=PICKS_TAB;category=null;return;}
  const parts=raw.split('/').map(s=>{try{return decodeURIComponent(s)}catch(e){return s}});
  if(LOCAL_TABS.includes(parts[0])){tab=parts[0];category=null;return;}
  if(TABS.includes(parts[0]) && countTab(parts[0])>0){
    tab=parts[0];
    const cats=catsFor(tab).map(c=>c.name);
    category=(parts[1] && cats.includes(parts[1]))?parts[1]:null;
  }
}

function renderTabs(){
  $('#tablist').innerHTML=TABS.map(t=>{
    const n=countTab(t);
    if(!LOCAL_TABS.includes(t) && !n) return '';
    return `<button class="tab" role="tab" data-tab="${esc(t)}" aria-selected="${t===tab}">${esc(t)}<span class="n">${n}</span></button>`;
  }).join('');
}
function renderSubtabs(){
  if(isLocal()){$('#subtabs').innerHTML='';$('#subtabs').hidden=true;return;}
  $('#subtabs').hidden=false;
  const cats=catsFor(tab);
  let html=`<button class="subtab" data-cat="" aria-selected="${!category}">全部<span class="n">${countTab(tab)}</span></button>`;
  html+=cats.map(c=>`<button class="subtab" data-cat="${esc(c.name)}" aria-selected="${category===c.name}">${esc(c.name)}<span class="n">${c.n}</span></button>`).join('');
  $('#subtabs').innerHTML=html;
}
function renderFacets(){
  const el=$('#facets');
  if(isLocal()){el.hidden=true;el.innerHTML='';$('#facetToggle').hidden=true;return;}
  const pool=DATA.filter(d=>inScope(d));
  const cnt=new Map();
  pool.forEach(d=>cnt.set(d.platform,(cnt.get(d.platform)||0)+1));
  let keys=[...cnt.keys()].filter(k=>cnt.get(k)>0);
  keys.sort((a,b)=>(PLATFORM_ORDER.indexOf(a)+1||99)-(PLATFORM_ORDER.indexOf(b)+1||99));
  if(keys.length<=1){el.hidden=true;el.innerHTML='';$('#facetToggle').hidden=true;return;}
  el.hidden=false;$('#facetToggle').hidden=false;
  el.innerHTML=`<div class="fgroup"><div class="flabel">平台</div><div class="chips" data-k="platform">${keys.map(v=>{
    const on=facet.platform.has(v);
    const n=DATA.filter(d=>matchLib(d,'platform')&&d.platform===v).length;
    return `<button class="chip" data-v="${esc(v)}" aria-pressed="${on}" ${!on&&n===0?'disabled':''}>${esc(v)}<span class="c">${n}</span></button>`;
  }).join('')}</div></div>`;
}
function renderFilters(){
  const local=isLocal();
  if(local){onlyUnmarked=false;hideSkip=false;}
  $('#filterRow').hidden=local;
  $('#onlyUnmarked').hidden=local;$('#hideSkip').hidden=local;
  $('#onlyUnmarked').setAttribute('aria-pressed', onlyUnmarked?'true':'false');
  $('#hideSkip').setAttribute('aria-pressed', hideSkip?'true':'false');
}

function host(u){try{return new URL(u).host.replace(/^www\./,'')}catch(e){return u}}

function noteName(n){return n.replace(/\.md$/,'').replace(/^\d{4}-(\d{2}-\d{2})-/,'$1 ');}

function chipsHTML(set, selected, attr){
  const sel=new Set(selected||[]);
  const solo=set.length===1;
  return set.map(g=>`<div class="tp-group${solo?' solo':''}">${solo?'':`<div class="tp-glabel">${esc(g.g)}</div>`}<div class="tp-chips">${g.tags.map(t=>`<button type="button" class="tchip ${TONE[t]||''}" ${attr}="${esc(t)}" aria-pressed="${sel.has(t)}">${esc(t)}</button>`).join('')}</div></div>`).join('');
}
function pickerHTML(key, set, tags, note, isNew, isManual){
  const job=set===TAGSET_JOB;
  return `<div class="tagpicker" data-picker="${esc(key)}">
  <div class="tp-head">${job?'看完怎么用到简历/作品集':'哪里有用？'}<span class="tp-sub">可多选${isNew?' · 也可以先不选':''}</span></div>

</div>`;
}
function sumHTML(tags, note){
  if(!(tags&&tags.length)&&!note) return '';
  return `<div class="mark-sum">${(tags||[]).map(t=>`<span class="tsum ${TONE[t]||''}">${esc(t)}</span>`).join('')}${note?`<p class="mark-note">${esc(note)}</p>`:''}</div>`;
}

function markBar(d, m){
  const id=d.id, key='lib:'+id, cur=(m&&m.mark)||'';
  const useful=cur==='useful';
  let h=`<button type="button" class="markbtn useful" data-mark-act="useful" data-id="${esc(id)}" aria-pressed="${useful}">${useful?'有用 ✓':'有用'}</button>`;
  h+=`<button type="button" class="markbtn skip" data-mark-act="skip" data-id="${esc(id)}" aria-pressed="${cur==='skip'}">不看了</button>`;
  if(editing===key){
    h+=pickerHTML(key, tagSetFor(d.tab), m&&m.tags, m&&m.note, editingNew, false);
  }else if(useful){
    h+=`<button type="button" class="markbtn edit" data-edit="${esc(key)}">${(m.tags&&m.tags.length)?'编辑标签':'+ 选标签'}</button>`;
    h+=sumHTML(m.tags, m.note);
  }
  return `<div class="markbar" data-markbar="${esc(id)}">${h}</div>`;
}

// ---------- 我的笔记本 ----------
const NB_HL=[
  {tag:'简历/作品集要写进去',cls:'hl-emph',desc:'写作品集 / 简历时要放大、要明确写出来的点'},
  {tag:'别再这么写了',cls:'hl-drop',desc:'该删掉、别再当卖点的写法或做法'}
];
const NB_COPY={tag:'这句话能直接用',cls:'hl-copy',desc:'结构、句式、版式做法，可以直接借用'};
const NB_GROUPS=[...TAGSET_PORTFOLIO,{g:'招聘观察',tags:['面试官在看什么','岗位要求变了']}];

function nbEntries(){
  const out=[];
  DATA.forEach(d=>{
    const m=getMark(d.id);
    if(!m||m.mark!=='useful') return;
    out.push({key:'lib:'+d.id,title:d.title,url:d.url,note:m.note||'',src:d.tab,date:(m.at||'').slice(0,10)||d.added,tags:m.tags||[],hay:[d.title,d.url,d.category,d.tab,m.note||'',(m.tags||[]).join(' ')]});
  });
  manualPicks.forEach(p=>out.push({key:'man:'+p.id,title:p.title,url:p.url,note:p.note||'',src:'手动精选',date:p.added||'',tags:p.tags||[],hay:[p.title,p.url,p.note||'',p.source||'',(p.tags||[]).join(' ')]}));
  return out.filter(e=>qMatch(e.hay)).sort((a,b)=>b.date.localeCompare(a.date)||a.title.localeCompare(b.title));
}
function nbLine(e){
  const u=esc(e.url);
  return `<li class="nb-line"><div class="nb-main"><a class="t" href="${u}" target="_blank" rel="noopener noreferrer">${esc(e.title)}<span class="ext"> ↗</span></a>${e.note?`<span class="nb-note">${esc(e.note)}</span>`:''}</div><div class="nb-meta"><span class="pill">${esc(e.src)}</span><span>${esc(e.date)}</span><button type="button" class="nb-edit" data-nb-edit="${esc(e.key)}">改标签</button></div></li>`;
}
function nbHLSection(s, list){
  const items=list.filter(e=>e.tags.includes(s.tag));
  const body=items.length?`<ul class="nb-list">${items.map(nbLine).join('')}</ul>`:`<div class="nb-emptyline">暂无。在「招聘信息」卡片点「有用」，选「${esc(s.tag)}」。</div>`;
  return `<section class="nb-sec ${s.cls}"><h2>${esc(s.tag)}<span class="n">${items.length} 条</span></h2><p class="nb-desc">${esc(s.desc)}</p>${body}</section>`;
}
function renderNotebook(){
  const el=$('#notebook');
  const all=nbEntries();
  const total=countUseful();
  const tagged=all.filter(e=>e.tags.length).length;
  if(!total){
    el.innerHTML=`<div class="nb-empty"><h2>笔记本还是空的</h2>
      <ol><li>在「招聘信息」「作品集」「简历」等分类里，点卡片下方的「有用」</li>
      <li>在弹出的小面板里选固定标签（可多选），可再写一句备注</li>
      <li>回到这里，按「简历/作品集要写进去 / 别再这么写了 / 这句话能直接用 / 视觉 / 内容…」自动归类，可导出 Markdown</li></ol></div>`;
    return;
  }
  let html=`<div class="nb-head"><div class="nb-sum">共 <b>${all.length}</b> 条有用${q?'（搜索中）':''} · 已选标签 <b>${tagged}</b> 条</div><div class="nb-actions"><button type="button" class="btn-ghost" id="nbCopy">复制</button><button type="button" class="btn-primary" id="nbExport">导出 Markdown</button></div></div>`;
  html+=`<div class="nb-top">${NB_HL.map(s=>nbHLSection(s,all)).join('')}</div>`;
  html+=nbHLSection(NB_COPY, all);
  NB_GROUPS.forEach(g=>{
    const parts=g.tags.map(t=>{
      const items=all.filter(e=>e.tags.includes(t));
      return items.length?`<div class="nb-tag"><h3>${esc(t)}<span class="n">${items.length}</span></h3><ul class="nb-list">${items.map(nbLine).join('')}</ul></div>`:'';
    }).join('');
    if(parts) html+=`<section class="nb-sec"><h2>${esc(g.g)}</h2>${parts}</section>`;
  });
  const untagged=all.filter(e=>!e.tags.length);
  if(untagged.length) html+=`<section class="nb-sec"><h2>还没选标签<span class="n">${untagged.length} 条</span></h2><p class="nb-desc">点「改标签」补上，它们就会归到上面的分组里</p><ul class="nb-list">${untagged.map(nbLine).join('')}</ul></section>`;
  el.innerHTML=html;
}
function mdEsc(s){return String(s).replace(/([\[\]])/g,'\\$1');}
function notebookMarkdown(){
  const all=nbEntries();
  const line=e=>`- [${mdEsc(e.title)}](${e.url})${e.note?' — '+e.note:''}（${e.src} · ${e.date}）`;
  const today=new Date().toISOString().slice(0,10);
  let md=`# 我的笔记本\n\n> 导出于 ${today} · 共 ${all.length} 条有用\n`;
  [...NB_HL,NB_COPY].forEach(s=>{
    const items=all.filter(e=>e.tags.includes(s.tag));
    md+=`\n## ${s.tag}\n\n_${s.desc}_\n\n`+(items.length?items.map(line).join('\n'):'（暂无）')+'\n';
  });
  NB_GROUPS.forEach(g=>{
    let sec='';
    g.tags.forEach(t=>{const items=all.filter(e=>e.tags.includes(t));if(items.length) sec+=`\n### ${t}\n\n${items.map(line).join('\n')}\n`;});
    if(sec) md+=`\n## ${g.g}\n${sec}`;
  });
  const un=all.filter(e=>!e.tags.length);
  if(un.length) md+=`\n## 还没选标签\n\n${un.map(line).join('\n')}\n`;
  return md;
}
let toastTimer=null;
function toast(msg){
  let t=$('#toast');
  if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}
function copyText(s){
  const fallback=()=>{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'已复制 Markdown':'复制失败，请用「导出 Markdown」');};
  if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(s).then(()=>toast('已复制 Markdown'),fallback);}
  else fallback();
}
$('#notebook').addEventListener('click',e=>{
  if(e.target.closest('#nbExport')){
    const blob=new Blob([notebookMarkdown()],{type:'text/markdown;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`我的笔记本-${new Date().toISOString().slice(0,10)}.md`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
    toast('已导出 .md');return;
  }
  if(e.target.closest('#nbCopy')){copyText(notebookMarkdown());return;}
  const ed=e.target.closest('[data-nb-edit]');
  if(ed){
    const key=ed.dataset.nbEdit;
    if(key.startsWith('lib:')){const d=BY_ID.get(key.slice(4));if(!d)return;tab=d.tab;category=d.category;}
    else{tab=PICKS_TAB;category=null;}
    q='';$('#q').value='';facet.platform.clear();onlyUnmarked=false;hideSkip=false;
    editing=key;editingNew=false;scrollToKey=key;render();
  }
});

// ---------- 卡片交互 ----------
function closePicker(){editing=null;editingNew=false;}
function savePicker(pk){
  const key=pk.dataset.picker;
  const tags=[...pk.querySelectorAll('[data-tchip][aria-pressed=true]')].map(b=>b.dataset.tchip);
  const note=(pk.querySelector('.tp-note').value||'').trim();
  if(key.startsWith('lib:')) setMark(key.slice(4),'useful',{tags,note});
  else{
    const p=manualPicks.find(x=>'man:'+x.id===key);
    if(p){p.tags=tags;p.note=note;saveJSON(LS_MANUAL, manualPicks);}
  }
  closePicker();render();
}
document.getElementById('grid').addEventListener('click',e=>{
  const chip=e.target.closest('[data-tchip]');
  if(chip){e.preventDefault();e.stopPropagation();chip.setAttribute('aria-pressed',chip.getAttribute('aria-pressed')==='true'?'false':'true');return;}
  const pk=e.target.closest('.tagpicker');
  if(pk){
    e.stopPropagation();
    if(e.target.closest('[data-tp-save]')){savePicker(pk);return;}
    if(e.target.closest('[data-tp-close]')){closePicker();render();return;}
    if(e.target.closest('[data-tp-unmark]')){setMark(pk.dataset.picker.slice(4),null);closePicker();render();return;}
    return;
  }
  const edit=e.target.closest('[data-edit]');
  if(edit){e.preventDefault();e.stopPropagation();editing=edit.dataset.edit;editingNew=false;render();return;}
  const markAct=e.target.closest('[data-mark-act]');
  if(markAct){
    e.preventDefault();e.stopPropagation();
    const id=markAct.dataset.id, act=markAct.dataset.markAct, cur=getMark(id);
    if(act==='useful'){
      if(cur&&cur.mark==='useful'){editing='lib:'+id;editingNew=false;}
      else{setMark(id,'useful',{tags:[],note:''});editing='lib:'+id;editingNew=true;}
    }else{
      if(cur&&cur.mark==='skip') setMark(id,null);
      else setMark(id,'skip');
      if(editing==='lib:'+id) closePicker();
    }
    render();return;
  }
  const del=e.target.closest('[data-manual-del]');
  if(del){
    e.preventDefault();e.stopPropagation();
    const mid=del.dataset.manualDel;
    manualPicks=manualPicks.filter(p=>p.id!==mid);
    saveJSON(LS_MANUAL, manualPicks);
    render();return;
  }
  if(e.target.closest('.markbar')){e.stopPropagation();return;}
  if(e.target.closest('a'))return;
  const c=e.target.closest('.card');if(!c)return;
  const s=window.getSelection&&String(window.getSelection());if(s)return;
  const a=c.querySelector('a.open');if(a)a.click();
});
document.getElementById('grid').addEventListener('keydown',e=>{
  const pk=e.target.closest('.tagpicker');
  if(!pk)return;
  if(e.key==='Enter'&&e.target.classList.contains('tp-note')){e.preventDefault();savePicker(pk);}
  else if(e.key==='Escape'){e.preventDefault();closePicker();render();}
});

function render(){
  renderTabs();
  renderSubtabs();
  $('#pickForm').hidden=!isPicks();
  renderFilters();
  renderFacets();
  const note=isNote();
  $('#notebook').hidden=!note;
  $('#grid').hidden=note;
  document.querySelector('.status').hidden=note;
  document.querySelector('.toolbar').hidden=note&&!countUseful();
  if(note){
    renderNotebook();
    $('#grid').innerHTML='';
    $('#clear').hidden=true;
    writeHash();
    return;
  }
  $('#notebook').innerHTML='';
  let html='', listLen=0, scopeLen=0;
  if(isPicks()){
    const useful=DATA.filter(d=>isUseful(d.id));
    const libs=useful.filter(d=>{const m=getMark(d.id);return qMatch([d.title,d.why,d.url,d.platform,d.category,(d.tags||[]).join(' '),(m&&m.note)||'',((m&&m.tags)||[]).join(' ')]);})
      .sort((a,b)=>((getMark(b.id)||{}).at||'').localeCompare((getMark(a.id)||{}).at||'')||b.added.localeCompare(a.added));
    const manSorted=manualPicks.filter(matchManual).sort((a,b)=>(b.added||'').localeCompare(a.added||''));
    scopeLen=useful.length+manualPicks.length;
    listLen=libs.length+manSorted.length;
    html=listLen?manSorted.map(manualCard).join('')+libs.map(card).join(''):'<div class="empty">还没有精选。在其它分类里点「有用」，或在上方添加外部链接。</div>';
  }else{
    const scope=DATA.filter(d=>inScope(d));
    const list=DATA.filter(d=>matchLib(d)).sort((a,b)=>b.added.localeCompare(a.added)||(a.verified==='已核'?0:1)-(b.verified==='已核'?0:1)||a.id.localeCompare(b.id));
    scopeLen=scope.length;listLen=list.length;
    html=list.length?list.map(card).join(''):'<div class="empty">该分类下没有匹配条目，试试换二级分类或减少筛选。</div>';
  }
  $('#grid').innerHTML=html;
  $('#count').textContent=`显示 ${listLen} / ${scopeLen} 条`;
  $('#clear').hidden=!(q||facet.platform.size||category||onlyUnmarked||hideSkip);
  const nSel=facet.platform.size;
  $('#facetToggle').textContent=nSel?`筛选 · ${nSel}`:'筛选';
  writeHash();
  if(scrollToKey){
    const k=scrollToKey;scrollToKey=null;
    const c=[...document.querySelectorAll('#grid .card')].find(x=>x.dataset.key===k);
    if(c) c.scrollIntoView({block:'center'});
  }
  if(editing){
    const inp=document.querySelector('#grid .tagpicker .tp-note');
    // 不自动聚焦，避免手机弹键盘；保持在视口内即可
    const pk=document.querySelector('#grid .tagpicker');
    if(pk&&pk.getBoundingClientRect().bottom>window.innerHeight) pk.scrollIntoView({block:'nearest'});
  }
}

$('#tablist').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  tab=b.dataset.tab;category=null;facet.platform.clear();onlyUnmarked=false;hideSkip=false;closePicker();render();
});
$('#subtabs').addEventListener('click',e=>{
  const b=e.target.closest('.subtab');if(!b)return;
  category=b.dataset.cat||null;facet.platform.clear();render();
});
$('#facets').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b||b.disabled)return;
  const v=b.dataset.v;
  facet.platform.has(v)?facet.platform.delete(v):facet.platform.add(v);render();
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
$('#clear').addEventListener('click',()=>{facet.platform.clear();category=null;q='';onlyUnmarked=false;hideSkip=false;$('#q').value='';render();});
$('#facetToggle').addEventListener('click',e=>{const o=$('#facets').classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',o);});
$('#onlyUnmarked').addEventListener('click',()=>{onlyUnmarked=!onlyUnmarked;render();});
$('#hideSkip').addEventListener('click',()=>{hideSkip=!hideSkip;render();});

// 手动精选表单（作品集固定标签）
$('#pfTagChips').innerHTML=chipsHTML(TAGSET_PORTFOLIO, [], 'data-pfchip');
$('#pfTagChips').addEventListener('click',e=>{
  const b=e.target.closest('[data-pfchip]');if(!b)return;
  b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true');
});
function clearPickForm(){
  ['#pfTitle','#pfUrl','#pfNote','#pfSource'].forEach(s=>$(s).value='');
  document.querySelectorAll('#pfTagChips [data-pfchip]').forEach(b=>b.setAttribute('aria-pressed','false'));
}
$('#pfAdd').addEventListener('click',()=>{
  const title=($('#pfTitle').value||'').trim();
  const url=($('#pfUrl').value||'').trim();
  const note=($('#pfNote').value||'').trim();
  const source=($('#pfSource').value||'').trim();
  const tags=[...document.querySelectorAll('#pfTagChips [data-pfchip][aria-pressed=true]')].map(b=>b.dataset.pfchip);
  if(!title||!url){alert('请填写标题和链接');return;}
  try{new URL(url);}catch(e){alert('链接格式不对，需要完整 URL（含 https://）');return;}
  const id='m-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6);
  const added=new Date().toISOString().slice(0,10);
  manualPicks.unshift({id,title,url,note,tags,source,added});
  saveJSON(LS_MANUAL, manualPicks);
  clearPickForm();
  tab=PICKS_TAB;render();
});
$('#pfClear').addEventListener('click',clearPickForm);

readHash();
render();
window.addEventListener('hashchange',()=>{readHash();render();});
})();
</script>
</body>
